[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code2guide-agent"
version = "0.1.1"
description = "Persian Codebase UX Assistant - Automated UX Journey & Form Extractor"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Code2Guide Architect Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "langchain-openai>=0.1.0",
    "openai>=1.0.0",
    "hazm>=0.9.4",
    "tree-sitter>=0.21.0",
    "tree-sitter-languages>=1.10.2",
    "qdrant-client>=1.8.0",
    "fastembed>=0.2.6",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
