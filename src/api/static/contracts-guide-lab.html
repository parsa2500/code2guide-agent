<!doctype html>
<html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>راهنمای آزمایشی قراردادها</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#203047;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:930px;margin:auto;padding:32px 20px}header{border-bottom:1px solid #d4deea;padding-bottom:20px}h1{font-size:25px;margin:10px 0}p,li{line-height:2}small{color:#526277}.badge{display:inline-block;background:#fff0cc;color:#745500;padding:5px 12px;border-radius:20px;font-size:12px}.panel{background:white;border:1px solid #dbe3ed;border-radius:14px;padding:22px;margin-top:20px}label{display:block;font-weight:bold;margin-bottom:12px}textarea{width:100%;border:1px solid #a4b6ca;border-radius:8px;padding:14px;font:inherit;line-height:1.9;resize:vertical}button{background:#175ec5;border:0;color:white;border-radius:8px;padding:11px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.examples{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.examples button{background:#e8eff9;color:#214e8d;font-size:12px}.muted{color:#61718a;font-size:12px;overflow-wrap:anywhere}a{color:#175ec5}#result{display:none}li{padding:6px}.source{border-top:1px solid #e5eaf0;padding:12px 0}details{margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/2 Tahoma}dialog{width:min(850px,94%);max-height:85vh;overflow:auto;border:1px solid #bac7d8;border-radius:12px}dialog::backdrop{background:#17273d88}.actions{display:flex;gap:14px;align-items:center}#state{font-size:13px;color:#526277}
</style><main>
<header><span class="badge">نسخهٔ آزمایشی مستقل · نیازمند بازبینی</span><h1>راهنمای کار با سامانه قراردادها</h1><p>دربارهٔ مراحل انجام کار بپرسید و منبع هر مرحله را ببینید.</p><small>این آزمایش به سامانهٔ اصلی متصل نیست. نقش، تنظیمات مشتری و نسخهٔ نصب‌شده هنوز تطبیق داده نشده‌اند.</small></header>
<section class="panel"><form id="form"><label for="question">چه کاری می‌خواهید انجام دهید؟</label><textarea id="question" rows="3" maxlength="1200" required placeholder="مثلاً چطور منابع پیشنهادی را به درخواست اضافه کنم؟"></textarea><div class="examples"><button type="button" data-q="چطور منابع پیشنهادی را به درخواست اضافه کنم و به فهرست شرکت‌کنندگان انتقال بدهم؟">افزودن منابع پیشنهادی</button><button type="button" data-q="نحوه تعریف و طراحی قالب مستندات قراردادها چه مراحلی دارد؟">قالب مستندات</button><button type="button" data-q="نحوه تشکیل و ثبت پرونده دعاوی و ارتباط آن با قرارداد چیست؟">ثبت پرونده دعاوی</button></div><div class="actions"><button id="send" type="submit">دریافت راهنما</button><span id="state" role="status" aria-live="polite"></span></div></form></section>
<section id="result" class="panel" aria-live="polite"><span id="status" class="badge"></span><p id="answer"></p><ol id="steps"></ol><p id="clarify"></p><details id="code"><summary>نکات تکمیلی از بررسی کد · نیازمند بازبینی</summary><div id="notes"></div></details><h3>منابع پاسخ</h3><div id="sources"></div><p id="trace" class="muted"></p></section><footer><p class="muted" id="revision"></p></footer>
<dialog id="evidence"><button id="close" type="button">بستن منبع</button><h3 id="sourceTitle"></h3><p id="sourceMeta" class="muted"></p><pre id="sourceText"></pre></dialog></main>
<script>
const $=id=>document.getElementById(id);document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('question').value=b.dataset.q;$('question').focus()});$('close').onclick=()=>$('evidence').close();
async function source(url){const r=await fetch(url);if(!r.ok)throw Error('منبع در دسترس نیست');const d=await r.json();$('sourceTitle').textContent=d.title;$('sourceMeta').textContent=`${d.uri} | خطوط ${d.start_line} تا ${d.end_line} | SHA-256: ${d.source_hash}`;$('sourceText').textContent=d.excerpt;$('evidence').showModal()}
function link(c,label){const a=document.createElement('a');a.href=c.url;a.textContent=label;a.onclick=e=>{e.preventDefault();source(c.url).catch(x=>{$('state').textContent=x.message})};return a}
fetch('/api/status').then(r=>r.json()).then(d=>{$('revision').textContent=`نسخهٔ دانش: ${d.revision} | مدل: ${d.model}`}).catch(()=>{});
$('form').onsubmit=async e=>{e.preventDefault();$('send').disabled=true;$('state').textContent='در حال بررسی راهنماها…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('question').value})});if(!r.ok)throw Error('پاسخ سرویس دریافت نشد');const d=await r.json();$('result').style.display='block';$('status').textContent=({partial:'پیش‌نویس · نیازمند بازبینی',clarify:'نیاز به توضیح بیشتر',refuse:'ارجاع به راهبر',escalate:'پاسخ معتبر کامل نشد'})[d.status]||d.status;$('answer').textContent=d.answer;$('clarify').textContent=d.clarification;$('steps').replaceChildren();const cites=new Map(d.citations.map(c=>[c.id,c]));for(const s of d.steps){const li=document.createElement('li');li.append(document.createTextNode(s.text+' '));for(const id of s.citation_ids){if(cites.has(id)){li.append(link(cites.get(id),' [منبع] '))}}$('steps').append(li)}$('sources').replaceChildren();for(const c of d.citations){const div=document.createElement('div');div.className='source';div.append(link(c,c.title||c.uri));const meta=document.createElement('div');meta.className='muted';meta.textContent=`${c.uri} | خطوط ${c.start_line}–${c.end_line} | نیازمند بازبینی`;div.append(meta);$('sources').append(div)}$('notes').replaceChildren();for(const n of d.code_notes){const p=document.createElement('pre');p.textContent=n.text;$('notes').append(p)}$('code').hidden=!d.code_notes.length;$('trace').textContent=`شناسه پیگیری: ${d.trace_id} | نسخه دانش: ${d.revision}`;$('state').textContent='بررسی تمام شد'}catch(x){$('state').textContent=x.message}finally{$('send').disabled=false}};
</script></html>
