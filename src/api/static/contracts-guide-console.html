<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>میز کنترل دستیار قراردادها</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#243548;background:#f5f7fb;--ink:#182638;--blue:#385ad8;--line:#e1e7ef;--muted:#69798d;--green:#168674}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}a{color:var(--blue)}.layout{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--ink);color:#d8e1ef;padding:28px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{font-size:20px;color:white;font-weight:bold;margin-bottom:6px}.brand small{display:block;font-size:11px;color:#9eacc0;margin-top:10px;font-weight:normal}.side-label{font-size:10px;color:#8799af;margin:27px 12px 10px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{background:transparent;color:#b9c6d8;text-align:right;border:0;padding:12px;border-radius:8px;font-size:13px;display:flex;gap:12px;align-items:center}.nav button.active{background:#314269;color:white}.nav button:hover{background:#293a50}.nav .icon{font:16px Arial;display:inline-flex;width:20px;justify-content:center}.side-foot{margin-top:auto;font-size:11px;color:#9bacc1;line-height:2;border-top:1px solid #324057;padding-top:18px}.side-dot{display:inline-block;background:#32c7a5;width:7px;height:7px;border-radius:50%;margin-left:5px}.workspace{padding:0 32px 35px;min-width:0}.topbar{height:76px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:10px}.crumb{font-size:12px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:14px}.pill{font-size:11px;padding:6px 10px;border-radius:16px;background:#e9f0fc;color:#405c97}.pill.warn{background:#fff0d0;color:#9a741d}.pill.green{background:#dff5ec;color:#167b61}h1{font-size:24px;margin:24px 0 10px}h2{font-size:16px;margin:0 0 15px}h3{font-size:14px}p{line-height:1.9;font-size:13px}.lead{color:var(--muted);margin:0 0 24px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}.card .value{font-size:25px;font-weight:bold;margin:12px 0 7px;color:#243a65}.card .label{color:var(--muted);font-size:12px}.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:20px}.full{margin-top:20px}.muted{font-size:12px;color:var(--muted);line-height:1.8}.mono{font-family:Consolas,monospace;direction:ltr;text-align:left;overflow-wrap:anywhere;font-size:11px}.btn{padding:10px 16px;background:var(--blue);color:white;border:0;border-radius:7px;font-size:12px}.btn.secondary{background:#edf1fa;color:#3a548a}.btn.ghost{background:white;color:#41516a;border:1px solid var(--line)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}label{font-size:12px;display:block;margin-bottom:8px;font-weight:bold}input,select,textarea{width:100%;border:1px solid #cfd9e7;border-radius:7px;padding:10px;background:white;color:#243548}textarea{line-height:1.9;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.formfield{margin-bottom:16px}pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/2 Tahoma,Arial,sans-serif;background:#f7f9fc;border-radius:8px;padding:14px;max-height:450px;overflow:auto}.list{display:flex;flex-direction:column;gap:8px}.item{padding:13px 14px;border:1px solid var(--line);border-radius:9px;background:white;text-align:right;color:inherit;line-height:1.8}.item:hover,.item.selected{border-color:#7894e5;background:#f5f7ff}.row{display:flex;justify-content:space-between;gap:14px;align-items:center}.divider{border-top:1px solid var(--line);margin:14px 0}.empty{padding:28px;color:var(--muted);font-size:13px;text-align:center}.pipeline{display:flex;gap:12px;overflow:auto;padding:12px 0}.stage{min-width:130px;flex:1;background:#f5f8fd;border:1px solid #dae3f0;border-radius:9px;padding:13px;font-size:11px;line-height:1.8}.stage .num{color:#6a86be;font-weight:bold;margin-bottom:5px}.stage.done{background:#ecf8f3;border-color:#c9e9dc}.notice{background:#fff7e7;border:1px solid #fae4b7;border-radius:8px;padding:13px;color:#86662a;font-size:12px;line-height:1.9;margin-bottom:20px}.tag{font-size:10px;color:#536a88;background:#edf2f8;padding:3px 7px;border-radius:5px}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:right;color:var(--muted);font-weight:normal;background:#f8fafd}th,td{padding:12px;border-bottom:1px solid var(--line);line-height:1.8;vertical-align:top}details{margin:14px 0}summary{cursor:pointer;font-size:12px;color:#425777;margin-bottom:10px}#toast{position:fixed;bottom:24px;left:24px;padding:13px 20px;background:#243a59;color:white;border-radius:9px;font-size:12px;max-width:500px;z-index:10;display:none}.graphwrap{background:#fbfcff;overflow:auto;border:1px solid var(--line);border-radius:10px;direction:ltr}.node{cursor:pointer}.node:hover rect{stroke:#385ad8;stroke-width:2}.node text{font-family:Tahoma;font-size:12px;fill:#263a5d}.edge{cursor:pointer}.edge:hover{stroke:#385ad8!important;stroke-width:3}iframe{border:0;width:100%;height:850px;border-radius:12px;background:white}.hidden{display:none!important}.small-stat{font-weight:bold;color:#2f527f}#content{animation:fade .18s}@keyframes fade{from{opacity:.4}to{opacity:1}}@media(max-width:1050px){.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}.workspace{padding:0 20px 25px}}@media(max-width:720px){.layout{display:block}.sidebar{position:static;height:auto;padding:18px}.nav{flex-direction:row;overflow:auto;margin-top:10px}.nav button{white-space:nowrap}.side-label,.side-foot{display:none}.brand small{display:inline;margin-right:10px}.workspace{padding:0 14px 20px}.grid2{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.topbar{height:65px}.cards{gap:10px}.card{padding:16px}.crumb{display:none}}
</style></head>
<body><div class="layout"><aside class="sidebar"><div class="brand">میز کنترل دستیار<small>Contracts.Main · محیط مستقل</small></div><div class="side-label">مدیریت آزمایش و دانش</div><nav class="nav" aria-label="بخش‌های پنل">
<button data-tab="overview" class="active"><span class="icon">◈</span>نمای کلی</button><button data-tab="chat"><span class="icon">◌</span>آزمایش چت</button><button data-tab="settings"><span class="icon">⚙</span>پرامپت و تنظیمات</button><button data-tab="knowledge"><span class="icon">▤</span>اسناد و دانش</button><button data-tab="graph"><span class="icon">⌘</span>گراف و روابط</button><button data-tab="traces"><span class="icon">≋</span>لاگ و مسیر پاسخ</button><button data-tab="evaluations"><span class="icon">✓</span>ارزیابی پاسخ‌ها</button><button data-tab="jobs"><span class="icon">▷</span>عملیات و تست‌ها</button><button data-tab="reviews"><span class="icon">☑</span>بازبینی و یادداشت</button></nav><div class="side-foot"><span class="side-dot"></span>دسترسی محلی روی همین سیستم<br>فاز ۱ · در انتظار پذیرش پشتیبانی<br><span id="side-model">در حال اتصال…</span></div></aside>
<main class="workspace"><header class="topbar"><div class="crumb">Contracts.Main / <span id="crumb">نمای کلی</span></div><div class="top-actions"><span class="pill warn">محیط آزمایشی</span><button class="btn ghost" id="refresh">تازه‌سازی</button></div></header><h1 id="title">نمای کلی</h1><p class="lead" id="subtitle">وضعیت دانش، سرویس‌ها و آزمایش‌ها در یک نگاه</p><div id="content"><div class="empty">در حال دریافت وضعیت…</div></div></main></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), state={tab:'overview',settings:null,knowledge:null};
const titles={overview:['نمای کلی','وضعیت دانش، سرویس‌ها و آزمایش‌ها در یک نگاه'],chat:['آزمایش چت','سؤال بپرسید، پاسخ را بررسی کنید و منابع آن را باز کنید'],settings:['پرامپت و تنظیمات','تنظیمات ذخیره‌شده از سؤال بعدی اعمال می‌شوند؛ هر تغییر نسخه دارد'],knowledge:['اسناد و دانش','ورودی واقعی Brain در workspace فعال، همراه متن و هش'],graph:['گراف و روابط','برش واقعی منابع پیشنهادی؛ روی گره یا رابطه کلیک کنید'],traces:['لاگ و مسیر پاسخ','شواهد انتخاب‌شده، پرامپت واقعی، مراحل پردازش و پاسخ هر سؤال'],evaluations:['ارزیابی پاسخ‌ها','اجرای فنی و داوری محتوایی را برای هر سؤال ببینید'],jobs:['عملیات و تست‌ها','تست، بازخوانی دانش و ارزیابی را از همین‌جا اجرا کنید'],reviews:['بازبینی و یادداشت','نظر انسانی شما ثبت می‌شود؛ جایگزین خودکار حقیقت استخراج‌شده نیست']};
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function box(title){const b=el('section',undefined,'card');if(title)b.append(el('h2',title));return b}
function badge(text,kind=''){return el('span',text,'pill '+kind)}
function btn(text,fn,cls='secondary'){const b=el('button',text,'btn '+cls);b.type='button';b.onclick=()=>Promise.resolve().then(fn).catch(error);return b}
function toast(text){$('toast').textContent=text;$('toast').style.display='block';clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>$('toast').style.display='none',6000)}
function error(e){toast('خطا: '+e.message)}
async function api(path,method='GET',body){const r=await fetch('/api/console/'+path,{method,headers:{'Content-Type':'application/json','X-Guide-Console':'1'},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok){let d={};try{d=await r.json()}catch{}const messages={knowledge_conflict:'نسخه کاری تغییر کرده؛ صفحه را تازه کنید.',knowledge_busy:'انتشار دانش در حال اجراست.',pipeline_running:'یک پاسخ در حال اجراست؛ پس از پایان آن دوباره تلاش کنید.',document_exists:'این نام سند موجود است.',dangling_edge:'گره مبدأ یا مقصد موجود نیست.',invalid_edge_evidence:'شناسه شواهد رابطه معتبر نیست.',invalid_document_name:'نام فایل باید انگلیسی و با پسوند md باشد؛ مسیر پوشه وارد نکنید.',settings_conflict:'تنظیمات در جای دیگری تغییر کرده؛ صفحه را تازه کنید.',job_running:'یک عملیات در حال اجراست؛ پس از پایان آن دوباره تلاش کنید.',provider_key_not_configured:'کلید Gemini در محیط سرور موجود نیست.',evaluation_requires_gemini:'برای ارزیابی، حالت Gemini را در تنظیمات فعال کنید.',brain_unavailable:'Brain در دسترس نیست.'};throw Error(messages[d.detail]||('دریافت سرویس ناموفق بود ('+r.status+')'))}return r.json()}
function showData(parent,title,data){const d=el('details');d.append(el('summary',title),el('pre',typeof data==='string'?data:JSON.stringify(data,null,2)));parent.append(d)}
function statusLabel(s){return ({partial:'پاسخ پیش‌نویس',clarify:'نیاز به توضیح',refuse:'ارجاع به راهبر',escalate:'پاسخ نامعتبر',running:'در حال اجرا',passed:'موفق',failed:'ناموفق',interrupted:'متوقف‌شده'})[s]||s||'نامعلوم'}
async function navigate(tab){state.tab=tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('title').textContent=titles[tab][0];$('crumb').textContent=titles[tab][0];$('subtitle').textContent=titles[tab][1];$('content').replaceChildren(el('div','در حال دریافت…','empty'));try{await renderers[tab]()}catch(e){$('content').replaceChildren(el('div','دریافت اطلاعات این بخش انجام نشد. '+e.message,'notice'))}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>navigate(b.dataset.tab));$('refresh').onclick=()=>navigate(state.tab);
function metric(label,value,detail){const b=box();b.append(el('div',label,'label'),el('div',String(value),'value'),el('div',detail,'muted'));return b}
const renderers={};
renderers.overview=async()=>{const [health,settings,knowledge,traces,evaluations,jobs]=await Promise.all([api('overview'),api('settings'),api('knowledge'),api('traces'),api('evaluations'),api('jobs')]);if(state.tab!=='overview')return;const c=$('content');c.replaceChildren();$('side-model').textContent=settings.settings.provider==='none'?'حالت بدون مدل':settings.settings.model;const cards=el('div',undefined,'cards');cards.append(metric('دانش ورودی',knowledge.documents.length,'اسناد نسخه کاری؛ فعال‌سازی پس از انتشار'),metric('گراف این برش',knowledge.graph.nodes.length,'گره · '+knowledge.graph.edges.length+' رابطه'),metric('لاگ سؤال‌ها',traces.total_files,'در workspaceهای آزمایشی محلی'),metric('اجرای ارزیابی',evaluations.runs.length,'گزارش‌های کامل و بازآزمایی محدود'));c.append(cards);const g=el('div',undefined,'grid2'),services=box('وضعیت اتصال'),scope=box('نسخه و محدوده فعال');for(const [name,v]of [['رابط و چت',health.chat],['Brain API',health.brain],['PostgreSQL',health.database]]){const row=el('div',undefined,'row');row.append(el('p',name),badge(({running:'فعال',connected:'متصل'})[v]||v,v==='running'||v==='connected'?'green':'warn'));services.append(row)}services.append(el('p',health.provider_key_configured?'کلید مدل در محیط سرور موجود است.':'کلید مدل در محیط سرور تعریف نشده است.','muted'));scope.append(el('p','workspace: '+health.workspace,'mono'),el('p','revision: '+health.revision,'mono'),el('p','settings: '+settings.revision,'mono'),el('p','پاسخ‌ها نیازمند بازبینی‌اند. نقش، مشتری و نسخه نصب‌شده هنوز نامعلوم‌اند.','muted'));g.append(services,scope);c.append(g);const flow=box('مسیر واقعی آماده‌سازی و پاسخ');flow.classList.add('full');const pipeline=el('div',undefined,'pipeline');for(const [i,t]of ['راستی‌آزمایی ورودی','ثبت workspace','انتشار دانش','بازیابی شواهد','تولید پاسخ','کنترل استناد'].entries()){const b=el('div',undefined,'stage');b.append(el('div',String(i+1).padStart(2,'0'),'num'),el('div',t));pipeline.append(b)}flow.append(pipeline,el('p','زمان و نتیجه هر مرحلهٔ پاسخ در بخش لاگ ثبت می‌شود. مراحل آماده‌سازی این اجرا در جزئیات پایین هستند.','muted'));showData(flow,'رویدادهای واقعی راه‌اندازی',health.startup_events);c.append(flow);const quick=box('شروع یک آزمایش');quick.classList.add('full');const tb=el('div',undefined,'toolbar');tb.append(btn('رفتن به چت',()=>navigate('chat'),''),btn('تغییر پرامپت',()=>navigate('settings')),btn('مشاهده گراف',()=>navigate('graph')),btn('اجرای تست',()=>navigate('jobs')));quick.append(tb);if(jobs.length)quick.append(el('p','آخرین عملیات: '+statusLabel(jobs[0].status),'muted'));c.append(quick)};
renderers.chat=async()=>{const f=el('iframe');f.title='آزمایش چت فارسی';f.src='/chat';$('content').replaceChildren(f)};
const fieldLabels={model:'شناسه مدل Gemini',temperature:'تنوع پاسخ (۰ تا ۱)',max_output_tokens:'حداکثر توکن خروجی',max_search_hits:'حداکثر نتیجه جست‌وجو',max_seeds:'بودجه seed بازیابی',max_evidence_items:'حداکثر شاهد Brain',max_evidence_tokens:'بودجه توکن شواهد',max_document_chunks:'قطعات راهنما در prompt',max_code_notes:'قطعات کد محلی کنار پاسخ',max_steps:'حداکثر مراحل پاسخ'};
renderers.settings=async()=>{const d=await api('settings');state.settings=d;const c=$('content');c.replaceChildren();const note=el('div','پرامپت و پارامترها قابل ویرایش‌اند. الزام استناد، حفظ نسخه، محدودیت داده مجاز و انتظار بازبینی در مسیر اجرا ثابت می‌مانند.','notice');c.append(note);const form=box('تنظیم پاسخ‌گویی');const inputs={};function field(key,label,type='text'){const wrap=el('div',undefined,'formfield'),l=el('label',label),input=el(type==='textarea'?'textarea':type==='select'?'select':'input');input.id='setting-'+key;l.htmlFor=input.id;if(type==='select'){for(const [v,t]of [['gemini','پاسخ با Gemini'],['none','فقط شواهد؛ بدون مدل']]){const op=el('option',t);op.value=v;input.append(op)}}else if(type==='textarea'){input.rows=key==='system_prompt'?8:3}else{input.type=type;if(type==='number'){input.step=key==='temperature'?'0.1':'1'}}input.value=d.settings[key];inputs[key]=input;wrap.append(l,input);return wrap}form.append(field('provider','حالت تولید پاسخ','select'));const grid=el('div',undefined,'formgrid');for(const [key,label]of Object.entries(fieldLabels))grid.append(field(key,label,key==='model'?'text':'number'));form.append(grid,field('system_prompt','پرامپت اصلی سیستم','textarea'),field('scope_prompt','توضیح زمینه همراه سؤال','textarea'));showData(form,'قواعد ثابت کنترل شواهد',d.fixed_guard);const actions=el('div',undefined,'toolbar'),saveButton=btn('ذخیره و اعمال تنظیمات',async()=>{saveButton.disabled=true;try{const settings={};for(const [k,v]of Object.entries(inputs))settings[k]=v.type==='number'?Number(v.value):v.value;const saved=await api('settings','PUT',{revision:state.settings.revision,settings});state.settings=saved;version.textContent='نسخه تنظیمات: '+saved.revision;toast('ذخیره شد؛ سؤال بعدی با این تنظیمات اجرا می‌شود.')}finally{saveButton.disabled=false}},'');const version=el('span','نسخه تنظیمات: '+d.revision,'mono');actions.append(saveButton,version);form.append(actions);c.append(form)};
async function loadKnowledge(){state.knowledge=await api('knowledge');return state.knowledge}
renderers.knowledge=async()=>{const d=await loadKnowledge(),c=$('content');c.replaceChildren();const search=el('input');search.placeholder='جست‌وجوی نام سند…';search.setAttribute('aria-label','جست‌وجوی سند');const grid=el('div',undefined,'grid2'),list=box('ورودی‌های دانش'),detail=box('متن و نسخه سند');const entries=el('div',undefined,'list');list.append(search,el('p','نمایش از Brain API؛ کد خام وارد prompt مدل نمی‌شود.','muted'),entries);function open(doc){detail.replaceChildren(el('h2',doc.name),badge(doc.kind==='help-document'?'راهنمای مجاز':'شواهد کد محلی',''),el('p','SHA-256: '+doc.sha256,'mono'),el('p','تعداد خطوط: '+doc.lines+' · نیازمند بازبینی','muted'),el('pre',doc.content))}function draw(){entries.replaceChildren();for(const doc of d.documents.filter(x=>x.name.toLowerCase().includes(search.value.toLowerCase()))){const b=el('button',undefined,'item');b.append(el('div',doc.name),el('small',doc.lines+' خط','muted'));b.onclick=()=>open(doc);entries.append(b)}}search.oninput=draw;draw();if(d.documents.length)open(d.documents[0]);grid.append(list,detail);c.append(grid)};
const nodeLabels={'request-menu':'منوی درخواست','suggestion-route':'مسیر منابع پیشنهادی','suggestion-index':'کنترلر صفحه','suggestion-view':'فرم منابع پیشنهادی','add-modal':'پنجره انتخاب منبع','invite-action':'افزودن منبع','confirm-action':'تأیید انتقال','delete-action':'حذف منبع','request-contractor':'منبع درخواست','tender-invite':'دعوت مناقصه'};
renderers.graph=async()=>{const d=await loadKnowledge(),g=d.graph,c=$('content');c.replaceChildren(el('div','این گراف فقط برش Q05 است. روابط استنباطی با خط‌چین نمایش داده می‌شوند؛ اجرا و تطابق نقش هنوز تأیید نشده‌اند.','notice'));const grid=el('div',undefined,'grid2');grid.style.gridTemplateColumns='minmax(0,1.6fr) minmax(280px,1fr)';const chart=box('گراف ساختاری · '+g.nodes.length+' گره'),detail=box('جزئیات گره یا رابطه'),wrap=el('div',undefined,'graphwrap');const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');const W=760,H=Math.max(350,Math.ceil(g.nodes.length/3)*105+60);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);svg.style.minWidth='600px';svg.style.width='100%';const positions=new Map(g.nodes.map((n,i)=>[n.id,{x:25+(i%3)*250,y:30+Math.floor(i/3)*105}]));function inspect(title,data){detail.replaceChildren(el('h2',title));if(data.statementFa)detail.append(el('p',data.statementFa));if(data.source)detail.append(el('p',data.source.path+':'+data.source.startLine+'–'+data.source.endLine,'mono'),el('p','SHA-256: '+data.source.sha256,'mono'));if(data.truthLevel)detail.append(badge(data.truthLevel));if(data.excerpt)detail.append(el('pre',data.excerpt));showData(detail,'داده کامل',data);if(data.evidenceIds)for(const id of data.evidenceIds){const obs=g.observations.find(o=>o.id===id);if(obs){const b=btn('شاهد: '+id,()=>inspect('شاهد '+id,obs));b.style.margin='6px';detail.append(b)}}}const defs=document.createElementNS(ns,'defs'),marker=document.createElementNS(ns,'marker');marker.id='arrow';marker.setAttribute('viewBox','0 0 10 10');marker.setAttribute('refX','9');marker.setAttribute('refY','5');marker.setAttribute('markerWidth','5');marker.setAttribute('markerHeight','5');marker.setAttribute('orient','auto-start-reverse');const tri=document.createElementNS(ns,'path');tri.setAttribute('d','M 0 0 L 10 5 L 0 10 z');tri.setAttribute('fill','#91a4c2');marker.append(tri);defs.append(marker);svg.append(defs);for(const edge of g.edges){const a=positions.get(edge.from),b=positions.get(edge.to);if(!a||!b)continue;const line=document.createElementNS(ns,'path');line.setAttribute('d',`M ${a.x+100} ${a.y+44} Q ${(a.x+b.x)/2+80} ${(a.y+b.y)/2+85} ${b.x+100} ${b.y}`);line.setAttribute('fill','none');line.setAttribute('stroke','#a9b9d2');line.setAttribute('stroke-width','1.5');line.setAttribute('marker-end','url(#arrow)');if(edge.truthLevel==='inferred')line.setAttribute('stroke-dasharray','5 4');line.classList.add('edge');line.onclick=()=>inspect(edge.relation,edge);const tip=document.createElementNS(ns,'title');tip.textContent=edge.from+' → '+edge.relation+' → '+edge.to;line.append(tip);svg.append(line)}for(const node of g.nodes){const p=positions.get(node.id),n=document.createElementNS(ns,'g'),rect=document.createElementNS(ns,'rect'),text=document.createElementNS(ns,'text');n.classList.add('node');rect.setAttribute('x',p.x);rect.setAttribute('y',p.y);rect.setAttribute('width','200');rect.setAttribute('height','44');rect.setAttribute('rx','8');rect.setAttribute('fill','#fff');rect.setAttribute('stroke','#d6dfec');text.setAttribute('x',p.x+100);text.setAttribute('y',p.y+27);text.setAttribute('text-anchor','middle');text.textContent=node.label||nodeLabels[node.id]||node.id;n.append(rect,text);n.onclick=()=>{inspect(node.label||nodeLabels[node.id]||node.id,{...node,relations:g.edges.filter(e=>e.from===node.id||e.to===node.id)});const rels=g.edges.filter(e=>e.from===node.id||e.to===node.id);for(const e of rels)detail.append(btn(e.relation,()=>inspect(e.relation,e)))};svg.append(n)}wrap.append(svg);chart.append(wrap,el('p','snapshot: '+g.sourceRevision,'mono'));grid.append(chart,detail);c.append(grid);const evidence=box('مشاهدات و مجهولات');evidence.classList.add('full');const items=el('div',undefined,'list');for(const o of g.observations){const b=el('button',undefined,'item');b.append(el('div',o.statementFa),el('small',o.id+' · '+o.truthLevel,'muted'));b.onclick=()=>{inspect('شاهد '+o.id,o);detail.scrollIntoView({behavior:'smooth',block:'nearest'})};items.append(b)}evidence.append(items);showData(evidence,'مجهولات باقی‌مانده',g.unknowns);c.append(evidence)};
const phaseNames={policy:'کنترل دامنه و سیاست',topic:'تشخیص موضوع',retrieval_started:'شروع بازیابی',retrieval_finished:'پایان بازیابی',evidence_selected:'انتخاب شواهد مجاز',generation_started:'شروع مدل',generation_finished:'دریافت خروجی مدل',citation_validation:'کنترل استناد',error:'خطا',finished:'پایان پاسخ'};
renderers.traces=async()=>{const data=await api('traces'),c=$('content');c.replaceChildren();const search=el('input');search.placeholder='جست‌وجو در سؤال‌ها…';search.setAttribute('aria-label','جست‌وجوی لاگ');const grid=el('div',undefined,'grid2'),list=box('سؤال‌های ثبت‌شده'),detail=box('مسیر واقعی پاسخ');const items=el('div',undefined,'list');list.append(search,el('p','نمایش آخرین '+data.limit+' لاگ از '+data.total_files+' فایل','muted'),items);async function open(t){const d=await api('traces/'+t.workspace+'/'+t.id);detail.replaceChildren(el('h2',d.question));const row=el('div',undefined,'toolbar');row.append(badge(statusLabel(d.response.status)),badge(d.response.model),badge((d.duration_ms??'؟')+' ms'));detail.append(row,el('p','workspace: '+d.workspace,'mono'),el('p','revision: '+d.revision,'mono'));const flow=el('div',undefined,'list');for(const e of d.events||[]){const line=el('div',undefined,'stage done');line.append(el('div',phaseNames[e.stage]||e.stage),el('small',e.elapsed_ms+' ms از شروع','muted'));flow.append(line)}if(!d.events)flow.append(el('p','این لاگ قدیمی است و ثبت مرحله‌ای ندارد.','muted'));detail.append(flow);showData(detail,'پرامپت سیستم واقعی',d.system_prompt||'در لاگ قدیمی ثبت نشده');showData(detail,'prompt واقعی ارسال‌شده به مدل',d.model_prompt||'مدل فراخوانی نشده');showData(detail,'شواهد واردشده به prompt',d.prompt_evidence);showData(detail,'شواهد کد محلی',d.code_evidence_local_only);showData(detail,'پاسخ و استنادها',d.response);showData(detail,'مصرف و تنظیمات همان اجرا',{usage:d.usage,settings_revision:d.settings_revision,settings:d.settings_snapshot});showData(detail,'لاگ کامل',d)}function draw(){items.replaceChildren();for(const t of data.items.filter(x=>String(x.question).includes(search.value))){const b=el('button',undefined,'item');b.append(el('div',t.question),el('small',statusLabel(t.status)+' · '+(t.started_at||t.workspace),'muted'));b.onclick=()=>open(t).catch(error);items.append(b)}if(!items.children.length)items.append(el('div','لا renderers.evaluations=async()=>{const d=await api('evaluations'),c=$('content');c.replaceChildren();const pick=el('select');pick.setAttribute('aria-label','انتخاب اجرای ارزیابی');d.runs.forEach((run,i)=>{const o=el('option',run.id+' · '+run.run.count+' سؤال');o.value=i;pick.append(o)});const panel=box('نتیجه اجرای انتخاب‌شده');c.append(pick,panel);panel.classList.add('full');function draw(){const r=d.runs[Number(pick.value)];panel.replaceChildren();if(!r){panel.append(el('div','هنوز گزارشی موجود نیست.','empty'));return}panel.append(el('h2',r.id),el('p',(r.run.duration_seconds||'?')+' ثانیه · '+r.run.model_calls+' فراخوانی مدل · وضعیت انسانی: '+r.run.human_review,'muted'));const table=el('table'),head=el('tr');for(const h of ['سؤال','پاسخ سرویس','بررسی فنی','داوری محتوایی'])head.append(el('th',h));table.append(head);for(const result of r.results){const row=el('tr'),review=d.agent_review?.baseline?.endsWith(r.id)?d.agent_review.rows.find(x=>x.id===result.id):null;row.append(el('td',result.id),el('td',statusLabel(result.response?.status)),el('td',result.technical_status),el('td',review?.note||'داوری محتوایی این اجرا ثبت نشده است'));row.onclick=()=>{const detail=el('details');detail.open=true;detail.append(el('summary',result.id+' — پاسخ ثبت‌شده'),el('pre',JSON.stringify(result,null,2)));panel.append(detail)};row.style.cursor='pointer';table.append(row)}panel.append(table);showData(panel,'مشخصات و مصرف اجرا',r.run)}pick.onchange=draw;draw();c.prepend(el('div','قبولی فنی یعنی اتصال و استناد سالم است؛ به معنی کامل‌بودن پاسخ یا تأیید کارشناس نیست. Q09 از امتیاز کیفیت کنار گذاشته می‌شود.','notice'))};

renderers.reviews=async()=>{const records=await api('reviews'),c=$('content');c.replaceChildren();const form=box('ثبت نظر بازبین');const fields={};for(const [key,label]of [['target','شناسه سؤال یا شاهد (مثلاً Q05 یا add-button)'],['reviewer','نام بازبین'],['note','یادداشت بازبینی']]){const w=el('div',undefined,'formfield'),l=el('label',label),input=el(key==='note'?'textarea':'input');input.id='review-'+key;l.htmlFor=input.id;fields[key]=input;w.append(l,input);form.append(w)}const decision=el('select');decision.setAttribute('aria-label','نتیجه بازبینی');for(const [v,t]of [['needs_changes','نیازمند اصلاح'],['approved','تأیید برای محدوده بررسی‌شده'],['rejected','رد']]){const o=el('option',t);o.value=v;decision.append(o)}form.append(decision,el('p','نظر شما به‌صورت محلی ثبت می‌شود؛ این ثبت، شواهد خام یا تأیید کلی MVP را تغییر نمی‌دهد.','muted'),btn('ثبت نظر',async()=>{await api('reviews','POST',{target:fields.target.value,reviewer:fields.reviewer.value,note:fields.note.value,decision:decision.value});toast('نظر بازبین ثبت شد.');await navigate('reviews')},''));c.append(form);for(const [id,r]of Object.entries(records)){const p=box(id);p.classList.add('full');p.append(el('p',r.reviewer+' · '+r.decision+' · '+r.reviewed_at),el('p',r.note));c.append(p)}};
